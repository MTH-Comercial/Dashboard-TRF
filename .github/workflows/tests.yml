name: Testes do Dashboard Transforma
on:
  push:
    branches: [main, "melhoria/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py analytics.py storage.py security.py
      - run: python -m unittest discover -s tests -v
